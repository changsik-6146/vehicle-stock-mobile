<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fa"><title>차량 재고 조회</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
main{max-width:620px;margin:auto;padding:22px 16px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:24px;margin:0;font-weight:800}.count{font-size:13px;color:#526078;background:#e9edf4;border-radius:20px;padding:7px 11px}
.sub{font-size:13px;color:#68758a;margin:8px 0 16px}.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:12px 15px;background:#172033;color:white;font-size:14px;font-weight:650}button.secondary{background:#e6eaf0;color:#263247}button:disabled{opacity:.5}
.status{font-size:12px;color:#69768a;min-height:18px;margin:5px 0 10px}
input{width:100%;height:52px;border:1px solid #d9e0ea;border-radius:15px;background:white;padding:0 16px;font-size:16px;outline:none}
input:focus{border-color:#64748b;box-shadow:0 0 0 3px #64748b20}.search{position:sticky;top:0;padding:7px 0 13px;background:#f5f7fa;z-index:2}
.cards{display:grid;gap:12px}.card{background:white;border:1px solid #e1e6ee;border-radius:17px;padding:16px;box-shadow:0 3px 12px #17203308}
.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.model{font-size:16px;font-weight:750;line-height:1.4}.price{font-size:15px;font-weight:800;white-space:nowrap}.plate{font-size:13px;color:#718096;margin-top:5px}
.details{border-top:1px solid #edf0f4;margin-top:13px;padding-top:11px;display:grid;gap:8px}.line{display:grid;grid-template-columns:82px 1fr;gap:8px;font-size:13px;line-height:1.45}.label{color:#8792a3}.value{color:#283449;overflow-wrap:anywhere}
.empty{background:white;border-radius:15px;padding:35px 12px;text-align:center;color:#788397}.foot{font-size:11px;color:#8b95a5;margin-top:18px;line-height:1.5}
</style>
<script src="https://alcdn.msauth.net/browser/3.28.1/js/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head><body><main>
<div class="top"><h1>차량 재고 조회</h1><span class="count" id="count">로그인 필요</span></div>
<div class="sub">OneDrive의 최신 엑셀을 읽기 전용으로 조회합니다.</div>
<div class="bar"><button id="login">Microsoft 로그인</button><button id="choose" class="secondary" disabled>엑셀 파일 찾기</button><button id="refresh" class="secondary" disabled>새로고침</button></div>
<div class="status" id="status">앱 등록 후 Client ID를 입력하면 연결할 수 있습니다.</div>
<div id="files"></div>
<div class="search"><input id="q" type="search" placeholder="차종 / 차량번호 검색" autocomplete="off" disabled></div>
<div class="cards" id="cards"><div class="empty">먼저 Microsoft 계정으로 로그인해 주세요.</div></div>
<div class="foot">읽기 전용 권한(Files.Read)을 사용합니다. 차량 데이터는 OneDrive에서 로그인한 사용자에게만 가져옵니다. 이 정적 웹앱의 소스 코드에는 차량 데이터나 Microsoft 비밀번호를 넣지 않습니다.</div>
</main>
<script>
const CLIENT_ID="여기에_애플리케이션_CLIENT_ID_입력";
const REDIRECT_URI=location.origin+location.pathname;
const msalInstance=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,authority:"https://login.microsoftonline.com/consumers",redirectUri:REDIRECT_URI},cache:{cacheLocation:"sessionStorage"}});
const scopes=["User.Read","Files.Read"];
let account=null,token=null,cars=[];
const $=id=>document.getElementById(id);
function status(t){$("status").textContent=t}
function esc(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}
function money(n){if(n==null||n==="")return "가격 미입력";let v=Number(n);return Number.isFinite(v)?new Intl.NumberFormat("ko-KR",{maximumFractionDigits:1}).format(v/10000)+"만원":esc(n)}
function render(){let term=$("q").value.trim().toLowerCase();let found=cars.filter(c=>(c.model+" "+c.plate).toLowerCase().includes(term));$("count").textContent=found.length+"대";
$("cards").innerHTML=found.length?found.map(c=>`<article class="card"><div class="head"><div><div class="model">${esc(c.model)}</div><div class="plate">${esc(c.plate||"차량번호 미입력")}</div></div><div class="price">${money(c.price)}</div></div><div class="details"><div class="line"><span class="label">차량위치</span><span class="value">${esc(c.location||"미입력")}</span></div><div class="line"><span class="label">특이사항</span><span class="value">${esc(c.note||"없음")}</span></div></div></article>`).join(""):'<div class="empty">검색 결과가 없습니다.</div>'}
async function getToken(){if(!account)throw Error("먼저 로그인해 주세요.");try{return (await msalInstance.acquireTokenSilent({scopes,account})).accessToken}catch{return (await msalInstance.acquireTokenPopup({scopes,account})).accessToken}}
async function graph(url){let t=await getToken();let r=await fetch(url,{headers:{Authorization:"Bearer "+t}});if(!r.ok)throw Error("Microsoft Graph 오류: "+r.status+" "+(await r.text()).slice(0,250));return r.json()}
async function login(){if(CLIENT_ID.startsWith("여기에_")){status("아직 Microsoft 앱 등록 Client ID가 설정되지 않았습니다.");return}
try{let res=await msalInstance.loginPopup({scopes});account=res.account;$("choose").disabled=false;$("refresh").disabled=false;status("로그인 완료. OneDrive에서 차량관리 엑셀을 선택해 주세요.");}catch(e){status("로그인 실패: "+e.message)}}
async function chooseFile(){try{status("OneDrive에서 차량관리 파일을 찾는 중…");let q=encodeURIComponent("차량관리");let d=await graph("https://graph.microsoft.com/v1.0/me/drive/root/search(q='"+q+"')?$select=id,name,size,lastModifiedDateTime,file,parentReference");let files=(d.value||[]).filter(x=>x.file&&/\.xlsx?$/i.test(x.name));if(!files.length){status("차량관리라는 이름의 엑셀을 찾지 못했습니다. OneDrive 파일명을 확인해 주세요.");return}
$("files").innerHTML='<div class="card" style="margin-bottom:12px"><b>조회할 엑셀 파일 선택</b>'+files.map(f=>`<div style="padding:10px 0;border-top:1px solid #eee"><button class="secondary" style="width:100%;text-align:left" data-id="${esc(f.id)}">${esc(f.name)} <small>· ${f.lastModifiedDateTime?new Date(f.lastModifiedDateTime).toLocaleString("ko-KR"):""}</small></button></div>`).join("")+'</div>';
$("files").querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",()=>loadWorkbook(b.dataset.id,b.textContent.trim())));status("파일을 선택하면 차량 목록을 불러옵니다.");}catch(e){status("파일 검색 실패: "+e.message)}}
async function loadWorkbook(id,name){try{status(name+" 다운로드 중…");let d=await graph("https://graph.microsoft.com/v1.0/me/drive/items/"+encodeURIComponent(id)+"?$select=id,name,@microsoft.graph.downloadUrl");let response=await fetch(d["@microsoft.graph.downloadUrl"]);if(!response.ok)throw Error("엑셀 다운로드 실패: "+response.status);let buf=await response.arrayBuffer();let book=XLSX.read(buf,{type:"array",cellDates:true});cars=[];
for(let sn of book.SheetNames){if(["양식","예시"].includes(sn))continue;let ws=book.Sheets[sn];if(!ws)continue;let model=ws["C6"]?.v||sn,plate=ws["I6"]?.v||"",price=ws["G14"]?.v??null,note=ws["C9"]?.v||"",location=ws["D21"]?.v||"";if(model)cars.push({model:String(model),plate:String(plate),price,note:String(note),location:String(location)})}
$("q").disabled=false;render();status(`${name}에서 ${cars.length}개 차량 시트를 읽었습니다. 파일을 저장한 뒤 새로고침을 누르면 최신 내용을 다시 가져옵니다.`);$("files").innerHTML="";}catch(e){status("엑셀 읽기 실패: "+e.message)}}
$("login").addEventListener("click",login);$("choose").addEventListener("click",chooseFile);$("refresh").addEventListener("click",()=>chooseFile());$("q").addEventListener("input",render);
</script></body></html>
